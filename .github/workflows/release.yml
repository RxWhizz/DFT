name: Release

# Los tags v* publican; workflow_dispatch permite ensayar el build completo sin
# crear ningún tag ni Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── La versión del código manda ─────────────────────────────────────────────
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.leer.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: leer
        shell: bash
        run: |
          VERSION="$(python3 -c "
          import re, pathlib
          texto = pathlib.Path('src/monitor_api/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', texto).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión del código: $VERSION"

          # Publicar un v0.3.0 que por dentro se llama 0.2.0 sería confuso para
          # siempre: mejor abortar aquí.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::El tag v$TAG no coincide con __version__ = $VERSION"
              exit 1
            fi
          fi

  # ── El SPA se compila una sola vez y lo comparten las dos plataformas ───────
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: src/monitor_api/static/
          retention-days: 1

  build:
    needs: [version, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plataforma: linux-x86_64
            artefacto: tar.gz
          - os: windows-latest
            plataforma: windows-x64
            artefacto: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El SPA compilado en el job anterior: idéntico en ambas plataformas.
      - uses: actions/download-artifact@v4
        with:
          name: spa
          path: src/monitor_api/static/

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # scikit-learn acotado a 1.8.x: los models/*.pkl se serializaron con
          # esa versión y 1.9 no los despickliza.
          python -m pip install \
            "fastapi>=0.110" "uvicorn[standard]>=0.27" "httpx>=0.27" \
            "psutil>=5.9" "pyyaml>=6.0" "itsdangerous>=2.1" \
            "numpy>=1.26" "pandas>=2.0" "scipy>=1.12" "scikit-learn>=1.8,<1.9" \
            "ase>=3.23" pyinstaller

      - name: Construir y probar
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/build_web.sh --skip-npm

      - uses: actions/upload-artifact@v4
        with:
          name: dft-monitor-web-${{ matrix.plataforma }}
          path: |
            dist/*.${{ matrix.artefacto }}
            dist/*.sha256
          retention-days: 7

  publish:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Reunir checksums
        shell: bash
        run: |
          cd artefactos
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          generate_release_notes: true
          body: |
            ## Monitor DFT ${{ needs.version.outputs.version }}

            Dos formas de usar la misma interfaz. Descarga la que te sirva:

            **`dft-monitor-desktop-…`** — aplicación de escritorio con ventana
            nativa y el motor congelado dentro. Autónoma: no necesita Python,
            Node ni el repositorio. Es la recomendada para el uso diario.

            ```bash
            tar xzf dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            ./dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64/dft_monitor_flutter
            ```

            **`dft-monitor-web-…`** — servidor que se abre en el navegador. Úsalo
            para mirar el pipeline desde otra máquina.

            ```bash
            tar xzf dft-monitor-web-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            ./dft-monitor-web/dft-monitor-web --data-root /ruta/a/tus/datos
            ```

            Se abre en `http://127.0.0.1:8000`. Con `--host 0.0.0.0` se expone en
            la red y exige un token en `monitor.auth.token`.

            En Windows, descomprime el `.zip` y ejecuta el `.exe`.

            Comprueba la descarga con `sha256sum -c SHA256SUMS`.

            Incluye ASE (LGPL-2.1-or-later) dentro del binario.
