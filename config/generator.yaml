# BUHO — Configuración del Generador de Candidatos ABX3
# Fase 1: Generación → Filtrado → Estructuras → DFT básico (r2SCAN)
#
# Uso:
#   python -m buho.generator generate  --config config/generator.yaml
#   python -m buho.generator filter    --config config/generator.yaml
#   python -m buho.generator build-structures --top 500
#   python -m buho.dft prepare-relax   --top 500
#   python -m buho.dft collect-results

version: "1.0.0"
random_seed: 42

# ── Espacio químico ────────────────────────────────────────────────────────────
chemical_space:
  A_sites: [Cs, MA, FA, Rb, K]
  B_sites: [Pb, Sn, Ge]
  X_sites: [I, Br, Cl]

# ── Generación ─────────────────────────────────────────────────────────────────
generation:
  # Fracciones discretas para mezclas de sitio
  fractions: [0.125, 0.25, 0.5, 0.75, 0.875]

  # Objetivos de candidatos
  n_candidates_raw: 5000       # target brutos (se genera todo lo que hay, sin límite duro)
  n_candidates_filtered: 2000  # target tras filtros (informativo)
  n_candidates_dft: 500        # seleccionados para DFT por score

  # Modos de generación activos
  modes:
    pure:        true   # 5A × 3B × 3X = 45 puros
    A_mixed:     true   # mezclas de 2 A-sites
    B_mixed:     true   # mezclas de 2 B-sites
    X_mixed:     true   # mezclas de 2 o 3 X-sites
    multi_mixed: false  # A+X mixtos simultáneos (más costoso)

# ── Filtros físicos ───────────────────────────────────────────────────────────
filters:
  goldschmidt:
    min: 0.80
    max: 1.10
  octahedral:
    min: 0.40
    max: 0.90
  volume_A3:        # volumen estimado por fórmula unitaria
    min: 50.0
    max: 2000.0

# ── Construcción de estructuras ───────────────────────────────────────────────
structure:
  supercell_pure:    [1, 1, 1]   # celda unitaria para composiciones puras
  supercell_mixed:   [2, 2, 2]   # supercelda 2×2×2 (40 átomos) para mezclas
  organic_A_placeholder: Cs      # catión de reemplazo para MA/FA en estructura
  export_formats: [cif, poscar, traj]

# ── DFT básico (PBE) ──────────────────────────────────────────────────────────
# Config validada en FASE 0 (2026-06-04): PBE Γ-only ecut300 = 37s/iter, converge.
# r2SCAN descartado para cribado: domain>1 crashea GPAW master → r2SCAN a 1-core
# es 195s/iter (~5 días para 482 superceldas). r2SCAN+U+SOC se aplica después a top.
dft_basic:
  xc: PBE              # GGA: rápido, estable, domain-independiente; energías comparables

  ecut: 300            # eV — cribado rápido (producción r2SCAN: 450)
  kpts: [2, 2, 2]      # celdas unidad; superceldas → Γ-only [1,1,1] automático
  smearing: 0.01       # FermiDirac width (eV) — Sn usa 0.2 internamente
  fmax: 0.05           # eV/Å — criterio FIRE
  max_steps: 30        # pasos FIRE (cribado: relajación parcial aceptable para ranking)
  maxiter: 200         # iteraciones SCF máximas
  conv_density: 1.0e-3 # convergencia de densidad (cribado)
  soc: false           # SOC reservado para refinamiento de candidatos top

  # Legado (no usados con XC=PBE, mantenidos por compat de _write_input):
  sn_u_ev: 2.5
  kpt_rank_cap: 1

# ── ML (Fase 2 — diferida) ────────────────────────────────────────────────────
ml_initial:
  test_size: 0.2
  cv_folds: 5
  n_bootstrap: 50

# ── Active learning (Fase 2 — diferida) ──────────────────────────────────────
acquisition:
  n_top: 100
  beta: 1.0
  pv_window: [1.1, 1.8]

# ── Rutas de salida ───────────────────────────────────────────────────────────
paths:
  raw_candidates:      data/raw/generated_candidates.jsonl
  filtered_candidates: data/processed/filtered_candidates.csv
  top_candidates:      data/processed/top500_candidates.csv
  relax_dir:           runs/relax_basic
  results_csv:         data/processed/relax_basic_results.csv
  models_dir:          models/initial_predictors
  reports_dir:         reports
